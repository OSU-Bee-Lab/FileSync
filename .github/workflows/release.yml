name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (e.g. v0.1.0)'
        required: true

env:
  APP_NAME: FileSync
  APP_ID: com.osubeelab.filesync

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: darwin
          - platform: ubuntu-22.04
            os: linux
          - platform: windows-latest
            os: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libasound2-dev

      - name: Install MinGW (cgo compiler for Windows)
        if: matrix.os == 'windows'
        # Pinned to a commit past the v2 tag: v2 still has a "static
        # workaround" step that deletes libpthread.dll.a, which the current
        # chocolatey mingw package no longer ships, failing the job. Fixed
        # upstream on the default branch but never re-tagged as v2.
        uses: egor-tensin/setup-mingw@0ea9f5370e9405e1b4cc436a2668226b02450eb2
        with:
          platform: x64

      - name: Install fyne packaging tool
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Set app version from tag
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "GOFLAGS=-ldflags=-X=github.com/OSU-Bee-Lab/filesync/internal/appversion.Version=${version:-0.0.0}" >> "$GITHUB_ENV"

      # Signs the .app with a self-signed certificate. This does not satisfy
      # Gatekeeper (users still see the unidentified-developer dialog once),
      # but it gives the bundle a stable designated requirement so macOS keeps
      # folder-access and Keychain approvals across relaunches and updates.
      # Generate the cert with scripts/macos-signing-cert.sh.
      - name: Import macOS signing certificate
        if: matrix.os == 'darwin'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE not set — building unsigned (ad-hoc)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # codesign refuses to build a chain to an untrusted self-signed root,
          # so the leaf has to be trusted on the runner itself.
          # System LibreSSL, not the Homebrew OpenSSL 3 on PATH — the latter
          # needs the legacy provider to read the 3DES-encrypted p12.
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" \
            -passin pass:"$MACOS_CERTIFICATE_PASSWORD" \
            -nokeys -clcerts -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"

          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Package (macOS)
        if: matrix.os == 'darwin'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          fyne package -os darwin -icon Icon.png -name "$APP_NAME" -appID "$APP_ID"
          codesign --force --deep --sign "${MACOS_SIGNING_IDENTITY:--}" "$APP_NAME.app"

          dmg_dir="$(mktemp -d)"
          mv "$APP_NAME.app" "$dmg_dir/"
          ln -s /Applications "$dmg_dir/Applications"
          hdiutil create -volname "$APP_NAME" -srcfolder "$dmg_dir" -ov -format UDZO "$APP_NAME-macOS.dmg"

      - name: Package (Linux)
        if: matrix.os == 'linux'
        run: |
          fyne package -os linux -icon Icon.png -name "$APP_NAME" -appID "$APP_ID"
          mv "$APP_NAME.tar.xz" "$APP_NAME-Linux.tar.xz"

      - name: Package (Linux .deb)
        if: matrix.os == 'linux'
        run: |
          extract_dir="$(mktemp -d)"
          tar -xJf "$APP_NAME-Linux.tar.xz" -C "$extract_dir"

          pkg_root="$(mktemp -d)/filesync"
          mkdir -p "$pkg_root/DEBIAN" "$pkg_root/usr/bin" \
            "$pkg_root/usr/share/applications" "$pkg_root/usr/share/pixmaps"
          cp "$extract_dir/filesync/usr/local/bin/filesync" "$pkg_root/usr/bin/filesync"
          cp "$extract_dir/filesync/usr/local/share/applications/$APP_NAME.desktop" \
            "$pkg_root/usr/share/applications/$APP_NAME.desktop"
          cp "$extract_dir/filesync/usr/local/share/pixmaps/$APP_NAME.png" \
            "$pkg_root/usr/share/pixmaps/$APP_NAME.png"

          # Derive Depends from the actual shared libraries the binary links
          # against, mapped back to the Ubuntu packages that provide them, so
          # `apt install ./FileSync-Linux.deb` resolves runtime deps itself.
          deps="$(ldd "$pkg_root/usr/bin/filesync" \
            | awk '{print $3}' | grep '^/' | sort -u \
            | xargs -r dpkg -S 2>/dev/null \
            | cut -d: -f1 | sort -u | paste -sd, -)"

          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"

          printf 'Package: filesync\n' > "$pkg_root/DEBIAN/control"
          printf 'Version: %s\n' "${version:-0.0.0}" >> "$pkg_root/DEBIAN/control"
          printf 'Section: utils\n' >> "$pkg_root/DEBIAN/control"
          printf 'Priority: optional\n' >> "$pkg_root/DEBIAN/control"
          printf 'Architecture: amd64\n' >> "$pkg_root/DEBIAN/control"
          printf 'Depends: %s\n' "$deps" >> "$pkg_root/DEBIAN/control"
          printf 'Maintainer: OSU Bee Lab\n' >> "$pkg_root/DEBIAN/control"
          printf 'Description: Sync bioacoustics experiment data between local folders and cloud remotes\n' >> "$pkg_root/DEBIAN/control"

          dpkg-deb --build --root-owner-group "$pkg_root" "$APP_NAME-Linux.deb"

      - name: Verify .deb installs cleanly
        if: matrix.os == 'linux'
        run: |
          docker run --rm -v "$PWD:/work" -w /work ubuntu:22.04 bash -c \
            "apt-get update -qq && apt-get install -y -qq ./$APP_NAME-Linux.deb"

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          fyne package -os windows -icon Icon.png -name "$APP_NAME" -appID "$APP_ID"
          mv "$APP_NAME.exe" "$APP_NAME-Windows.exe"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ env.APP_NAME }} ${{ inputs.tag || github.ref_name }}
          draft: true
          prerelease: false
          files: |
            ${{ env.APP_NAME }}-macOS.dmg
            ${{ env.APP_NAME }}-Linux.tar.xz
            ${{ env.APP_NAME }}-Linux.deb
            ${{ env.APP_NAME }}-Windows.exe

  # Guards against silently shipping an unsigned bundle: a linker-adhoc binary
  # reports "Sealed Resources=none" and no designated requirement, which is
  # exactly the state that makes macOS re-prompt for folder-access permissions
  # on every launch and update.
  #
  # This checks the published DMG rather than the build tree: the tree is not
  # reliably still there once the build job finishes, and the shipped
  # artifact is what actually matters anyway.
  verify-macos-signature:
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Verify signature on the published DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$MACOS_SIGNING_IDENTITY" ]; then
            echo "No signing identity configured — skipping verification."
            exit 0
          fi

          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.dmg' -D . --clobber
          DMG=$(ls ./*.dmg | head -1)
          echo "Verifying $DMG"

          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint ./mnt >/dev/null
          trap 'hdiutil detach ./mnt -quiet || true' EXIT
          APP=./mnt/FileSync.app

          codesign -dvvv "$APP"
          codesign -d -r- "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          # An ad-hoc/linker signature has no designated requirement at all,
          # so this is the assertion that actually catches a regression.
          if ! codesign -d -r- "$APP" 2>&1 | grep -q 'designated =>'; then
            echo "No designated requirement — bundle is effectively unsigned." >&2
            exit 1
          fi
